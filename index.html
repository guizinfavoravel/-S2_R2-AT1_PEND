<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Itens Dinamicamente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 500px; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="container shadow p-4 bg-white rounded">
        <h2 class="text-center mb-4">Minha Lista Dinâmica</h2>
        
        <div class="input-group mb-3">
            <input type="text" id="itemInput" class="form-control" placeholder="Digite algo">
            
            <button class="btn btn-success" onclick="adicionarItem()">Adicionar</button>
        </div>

        <ul id="listaDinamica" class="list-group">
            </ul>
    </div>

    <script src="./index.js"></script>

</body>
</html>
