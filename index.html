<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista Dinâmica</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 { text-align: center; color: #333; }
        .controles { display: flex; gap: 10px; }
        
        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 15px;
            background-color: #6f42c1;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #59359a; }

        
        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        li {
            background: #f8f9fa;
            margin-bottom: 5px;
            padding: 10px;
            border-left: 4px solid #6f42c1;
            border-radius: 3px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Minha Lista</h2>
        
        <div class="controles">
            <input type="text" id="itemInput" placeholder="Digite uma tarefa...">
            <button onclick="adicionarItem()">Adicionar</button>
        </div>

        <ul id="minhaLista"></ul>
    </div>

    <script src="./index.js"></script>

</body>
</html>
